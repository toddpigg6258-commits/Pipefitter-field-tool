<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pipefitter Manual Viewer</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #e5e7eb; color: #111827; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
      .viewer { min-height: 100vh; display: flex; flex-direction: column; }
      .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left)); background: #111827; color: #fff; }
      button, input { min-height: 40px; font: inherit; border-radius: 7px; border: 1px solid #64748b; }
      button { padding: 7px 12px; background: #fff; color: #111827; font-weight: 800; }
      input { width: 64px; padding: 6px; text-align: center; background: #fff; color: #111827; }
      .count { min-width: 74px; font-size: 12px; text-align: center; }
      .status { padding: 7px 10px; background: #f8fafc; border-bottom: 1px solid #cbd5e1; color: #475569; font-size: 12px; text-align: center; }
      .stage { flex: 1; overflow: auto; padding: 10px; text-align: center; -webkit-overflow-scrolling: touch; }
      canvas { display: block; max-width: 100%; height: auto; margin: 0 auto; background: #fff; box-shadow: 0 2px 12px #0003; }
      @media (max-width: 520px) { .bar { gap: 5px; } button { padding: 6px 9px; } .stage { padding: 4px; } }
    </style>
  </head>
  <body>
    <div class="viewer">
      <div class="bar">
        <button id="prev" type="button" aria-label="Previous manual page">‹ PREV</button>
        <input id="page" inputmode="numeric" aria-label="Manual page number" />
        <span id="count" class="count">of …</span>
        <button id="next" type="button" aria-label="Next manual page">NEXT ›</button>
      </div>
      <div id="status" class="status">Loading manual…</div>
      <div class="stage"><canvas id="pdfCanvas"></canvas></div>
    </div>
    <script type="module" src="./src/manual-viewer.ts"></script>
  </body>
</html>
