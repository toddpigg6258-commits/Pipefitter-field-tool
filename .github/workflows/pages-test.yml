name: Pipefitter Test Site

on:
  push:
    branches: [pages-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set up Python for original field guide
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check 63-page field guide
        run: |
          python -m pip install reportlab pypdf
          python scripts/build-field-guide.py
          python -c "from pypdf import PdfReader; p='public/resources/Pipefitter-Field-Guide-Test-Edition-03.pdf'; assert len(PdfReader(p).pages)==63, 'Incorrect guide length'"
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
